name: DART 대주주 공시 모니터링

# 매일 KST 08:50에 실행되도록 설정 (UTC 23:50)
# 일~목 UTC 23:50은 한국 시간으로 월~금 오전 08:50입니다.
# 정각(0 0)은 GitHub 서버 과부하로 지연이 자주 발생하여 피하는 것이 좋습니다.
on:
  schedule:
    - cron: '50 23 * * 0-4'
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  check-disclosures:
    runs-on: ubuntu-latest
    
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 공시 모니터링 실행
        run: npx tsx src/index.ts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
